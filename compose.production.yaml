name: translatelab-production

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  edge:
    <<: *service-defaults
    image: ${CADDY_IMAGE:?Set an immutable CADDY_IMAGE reference}
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    init: true
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set the public API domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set the ACME contact email}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 20s

  backend:
    <<: *service-defaults
    image: ${BACKEND_IMAGE:?Set an immutable BACKEND_IMAGE reference}
    read_only: true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00
    init: true
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_PROFILES_ACTIVE: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-translation_lab}
      POSTGRES_USER: ${POSTGRES_USER:-translation_app}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-translation_app}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-translation}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Set an approved HTTPS MinIO endpoint}
      MINIO_BUCKET: ${MINIO_BUCKET:-translation-documents}
      MINIO_ALLOW_INSECURE_HTTP: "false"
      MINIO_ALLOWED_HOSTS: ${MINIO_ALLOWED_HOSTS:?Set the exact MinIO host allowlist}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_ISSUER: ${JWT_ISSUER:?Set the production JWT issuer}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-translation-frontend}
      JWT_KEY_ID: ${JWT_KEY_ID:?Set the active JWT key id}
      REFRESH_TOKEN_SESSION_TTL: ${REFRESH_TOKEN_SESSION_TTL:-7d}
      REFRESH_TOKEN_COOKIE_SECURE: "true"
      REFRESH_TOKEN_COOKIE_SAME_SITE: ${REFRESH_TOKEN_COOKIE_SAME_SITE:-Lax}
      REFRESH_TOKEN_CLEANUP_INTERVAL: ${REFRESH_TOKEN_CLEANUP_INTERVAL:-1h}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?Set the production frontend HTTPS URL}
      CORS_ENABLED: ${CORS_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OPENAPI_DOCS_ENABLED: "false"
      OPENAPI_PUBLIC_ACCESS: "false"
      ACCOUNT_EMAIL_DELIVERY_ENABLED: ${ACCOUNT_EMAIL_DELIVERY_ENABLED:-true}
      ACCOUNT_EMAIL_SENDER: ${ACCOUNT_EMAIL_SENDER:?Set the production sender email}
      SMTP_HOST: ${SMTP_HOST:?Set the SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-TRIBUTE}
      TRIBUTE_ENABLED: ${TRIBUTE_ENABLED:-true}
      TRIBUTE_BASE_URL: ${TRIBUTE_BASE_URL:-https://tribute.tg/api/v1}
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: ${TRUSTED_PROXY_REGEX:-10\..*|192\.168\..*|172\.(1[6-9]|2[0-9]|3[0-1])\..*}
      SERVER_CONNECTION_TIMEOUT: ${SERVER_CONNECTION_TIMEOUT:-10s}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-3000}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_ENDPOINTS: health,prometheus
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES_HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
      CONSOLE_LOG_STRUCTURED_FORMAT: ecs
      LOGGING_STRUCTURED_ECS_SERVICE_ENVIRONMENT: production
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp}
    secrets:
      - source: postgres_password
        target: spring.datasource.password
      - source: rabbitmq_password
        target: spring.rabbitmq.password
      - source: jwt_secret
        target: app.jwt.secret
      - source: minio_backend_access_key
        target: app.storage.access-key
      - source: minio_backend_secret_key
        target: app.storage.secret-key
      - source: tribute_api_key
        target: app.payment.tribute.api-key
      - source: smtp_username
        target: spring.mail.username
      - source: smtp_password
        target: spring.mail.password
    tmpfs:
      - /tmp:size=128m,mode=1777
    expose:
      - "8080"
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - edge
      - data
      - operations
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 40s

  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:?Set an immutable POSTGRES_IMAGE reference}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-translation_lab}
      POSTGRES_USER: ${POSTGRES_USER:-translation_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=3775
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.00
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - data
    stop_grace_period: 60s

  rabbitmq:
    <<: *service-defaults
    image: ${RABBITMQ_IMAGE:?Set an immutable RABBITMQ_IMAGE reference}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat /run/secrets/rabbitmq_password)"
        exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-translation_app}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-translation}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit max_message_size 65536"
    secrets:
      - rabbitmq_password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00
    expose:
      - "5672"
      - "15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - data
      - operations
    stop_grace_period: 60s

  prometheus:
    <<: *service-defaults
    image: ${PROMETHEUS_IMAGE:?Set an immutable PROMETHEUS_IMAGE reference}
    read_only: true
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle=false
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp:size=32m,mode=1777
    expose:
      - "9090"
    networks:
      - operations
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
    stop_grace_period: 30s

  alertmanager:
    <<: *service-defaults
    image: ${ALERTMANAGER_IMAGE:?Set an immutable ALERTMANAGER_IMAGE reference}
    read_only: true
    cap_drop: [ALL]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    command:
      - --config.file=/run/secrets/alertmanager_config
      - --storage.path=/alertmanager
    secrets:
      - alertmanager_config
    volumes:
      - alertmanager_data:/alertmanager
    tmpfs:
      - /tmp:size=16m,mode=1777
    expose:
      - "9093"
    networks:
      - operations
      - monitoring_egress
    stop_grace_period: 30s

networks:
  edge:
  data:
    internal: true
  operations:
    internal: true
  monitoring_egress:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  alertmanager_data:

secrets:
  postgres_password:
    file: ${PRODUCTION_SECRETS_DIR:?Set the production secrets directory}/postgres_password
  rabbitmq_password:
    file: ${PRODUCTION_SECRETS_DIR:?Set the production secrets directory}/rabbitmq_password
  jwt_secret:
    file: ${PRODUCTION_SECRETS_DIR:?Set the production secrets directory}/jwt_secret
  minio_backend_access_key:
    file: ${PRODUCTION_SECRETS_DIR:?Set the production secrets directory}/minio_backend_access_key
  minio_backend_secret_key:
    file: ${PRODUCTION_SECRETS_DIR:?Set the production secrets directory}/minio_backend_secret_key
  tribute_api_key:
    file: ${PRODUCTION_SECRETS_DIR:?Set the production secrets directory}/tribute_api_key
  smtp_username:
    file: ${PRODUCTION_SECRETS_DIR:?Set the production secrets directory}/smtp_username
  smtp_password:
    file: ${PRODUCTION_SECRETS_DIR:?Set the production secrets directory}/smtp_password
  alertmanager_config:
    file: ${PRODUCTION_SECRETS_DIR:?Set the production secrets directory}/alertmanager.yml
