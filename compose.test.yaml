name: translatelab-isolated-test

x-application-environment: &application-environment
  SPRING_CONFIG_IMPORT: optional:classpath:/isolated-test.properties
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: translation_test
  POSTGRES_USER: translation_test
  POSTGRES_PASSWORD: isolated-postgres-password
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: translation_test
  RABBITMQ_PASSWORD: isolated-rabbit-password
  RABBITMQ_VHOST: translation
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BACKEND_ACCESS_KEY: translation-backend-test
  MINIO_BACKEND_SECRET_KEY: isolated-backend-secret
  MINIO_BUCKET: translation-documents
  MINIO_ALLOW_INSECURE_HTTP: "true"
  MINIO_ALLOWED_HOSTS: minio
  JWT_SECRET: c3RhZ2U4LXRlc3Qta2V5LXN0YWdlOC10ZXN0LWtleS0zMmJ5dGVzIQ==
  JWT_ISSUER: https://isolated.test
  JWT_AUDIENCE: translation-test
  JWT_KEY_ID: isolated-test
  ACCOUNT_EMAIL_DELIVERY_ENABLED: "false"
  OPENAPI_DOCS_ENABLED: "false"
  TRIBUTE_ENABLED: "false"
  DB_LOCK_TIMEOUT_MS: "1000"

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: translation_test
      POSTGRES_USER: translation_test
      POSTGRES_PASSWORD: isolated-postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translation_test -d translation_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data:size=512m

  rabbitmq:
    image: rabbitmq:4-management-alpine@sha256:0753b75ce99094c385483d89449d532a0544fb85e4942a478b21cc497ab66d33
    environment:
      RABBITMQ_DEFAULT_USER: translation_test
      RABBITMQ_DEFAULT_PASS: isolated-rabbit-password
      RABBITMQ_DEFAULT_VHOST: translation
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit max_message_size 65536"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data
    environment:
      MINIO_ROOT_USER: isolated-minio-root
      MINIO_ROOT_PASSWORD: isolated-minio-root-password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data:size=512m

  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z@sha256:7e3efb09c22c0882fbf341b9d99f61f94ae6c4c20a06f2f1a2b20ea8993d8952
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: isolated-minio-root
      MINIO_ROOT_PASSWORD: isolated-minio-root-password
      MINIO_BACKEND_ACCESS_KEY: translation-backend-test
      MINIO_BACKEND_SECRET_KEY: isolated-backend-secret
      MINIO_BUCKET: translation-documents
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 \
          "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" >/dev/null
        while IFS= read -r policy_line || [ -n "$${policy_line}" ]; do
          policy_line="$${policy_line//__BUCKET__/$${MINIO_BUCKET}}"
          printf '%s\n' "$${policy_line}"
        done < /config/backend-policy.json > /tmp/backend-policy.json
        mc admin policy create local translation-backend \
          /tmp/backend-policy.json >/dev/null
        mc admin user add local "$${MINIO_BACKEND_ACCESS_KEY}" \
          "$${MINIO_BACKEND_SECRET_KEY}" >/dev/null
        mc admin policy attach local translation-backend \
          --user "$${MINIO_BACKEND_ACCESS_KEY}" >/dev/null
    volumes:
      - ./docker/minio/backend-policy.json:/config/backend-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy

  test-runner:
    profiles: [test]
    image: eclipse-temurin:21-jdk-jammy@sha256:55fb9bf738f5d9b4a6c01b39337e3070d3e27370dd3c478fd1d5d3cd2233c6d8
    working_dir: /workspace
    command:
      - bash
      - -ec
      - |
        ./mvnw -B -ntp -Pquality verify > /tmp/maven-test.log 2>&1 || {
          tail -n 250 /tmp/maven-test.log
          exit 1
        }
        tail -n 100 /tmp/maven-test.log
    environment:
      <<: *application-environment
    volumes:
      - .:/workspace:ro
      - test_target:/workspace/target
      - maven_cache:/root/.m2
    tmpfs:
      - /tmp:size=256m
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  smoke-backend:
    profiles: [smoke]
    image: ${BACKEND_SMOKE_IMAGE:-translation-backend:local}
    environment:
      <<: *application-environment
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  smoke-check:
    profiles: [smoke]
    image: eclipse-temurin:21-jdk-jammy@sha256:55fb9bf738f5d9b4a6c01b39337e3070d3e27370dd3c478fd1d5d3cd2233c6d8
    command:
      - bash
      - -ec
      - |
        curl --fail --silent http://smoke-backend:8080/actuator/health
        curl --fail --silent http://smoke-backend:8080/livez
        curl --fail --silent http://smoke-backend:8080/readyz
    depends_on:
      smoke-backend:
        condition: service_healthy

volumes:
  test_target:
  maven_cache:
    name: translatelab-maven-test-cache
    external: true
