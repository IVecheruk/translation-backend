groups:
  - name: translatelab-backend
    rules:
      - alert: BackendSustainedServerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.1
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Backend returns sustained 5xx responses"

      - alert: BackendHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Backend p95 request latency exceeds two seconds"

      - alert: TranslationDeadLetterQueueNotEmpty
        expr: translation_rabbit_dead_letters > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "A translation dead-letter queue contains messages"

      - alert: RabbitQueueBacklogGrowing
        expr: sum(rabbitmq_queue_messages_ready) > 1000
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "RabbitMQ ready-message backlog is growing"

      - alert: TranslationOutboxExhausted
        expr: increase(translatelab_messaging_outbox_exhausted_total[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Translation outbox events exhausted their retries"

      - alert: PaymentEventFailures
        expr: increase(translatelab_payment_webhook_events_total{outcome="failure"}[15m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "Payment webhook processing failed"

      - alert: StorageOperationFailures
        expr: increase(translatelab_storage_operations_total{outcome="failure"}[10m]) > 2
        labels: { severity: critical }
        annotations:
          summary: "Object storage operations are failing"

      - alert: QuotaRejectionsSpike
        expr: increase(translatelab_quota_operations_total{outcome="rejected"}[10m]) > 20
        labels: { severity: warning }
        annotations:
          summary: "Quota rejection rate increased"

      - alert: DatabasePoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Database connection pool has pending requests"

      - alert: BackendLowDiskSpace
        expr: disk_free_bytes / disk_total_bytes < 0.15
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Backend container has less than 15% disk space available"
