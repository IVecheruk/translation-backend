services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: translation-backend:local
    container_name: translation-backend
    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_ISSUER: ${JWT_ISSUER:-https://api.translatelab.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-translation-frontend}
      JWT_KEY_ID: ${JWT_KEY_ID:-primary}
      CORS_ENABLED: ${CORS_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      OPENAPI_PUBLIC_ACCESS: ${OPENAPI_PUBLIC_ACCESS:-false}
      RATE_LIMIT_REGISTRATION_PER_MINUTE: ${RATE_LIMIT_REGISTRATION_PER_MINUTE:-30}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-20}
      RATE_LIMIT_DOCUMENT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_DOCUMENT_UPLOAD_PER_MINUTE:-30}
      RATE_LIMIT_CHECKOUT_PER_MINUTE: ${RATE_LIMIT_CHECKOUT_PER_MINUTE:-10}
      RATE_LIMIT_ACCOUNT_EMAIL_REQUEST_PER_MINUTE: ${RATE_LIMIT_ACCOUNT_EMAIL_REQUEST_PER_MINUTE:-5}
      RATE_LIMIT_ACCOUNT_TOKEN_CONFIRMATION_PER_MINUTE: ${RATE_LIMIT_ACCOUNT_TOKEN_CONFIRMATION_PER_MINUTE:-20}
      RATE_LIMIT_MAXIMUM_TRACKED_KEYS: ${RATE_LIMIT_MAXIMUM_TRACKED_KEYS:-50000}
      ACCOUNT_EMAIL_DELIVERY_ENABLED: ${ACCOUNT_EMAIL_DELIVERY_ENABLED:-false}
      ACCOUNT_EMAIL_SENDER: ${ACCOUNT_EMAIL_SENDER:-noreply@translatelab.local}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-24h}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-30m}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}

      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-TRIBUTE}
      PAYMENT_PURCHASE_INTENT_TTL: ${PAYMENT_PURCHASE_INTENT_TTL:-30m}
      PAYMENT_MAINTENANCE_BATCH_SIZE: ${PAYMENT_MAINTENANCE_BATCH_SIZE:-100}
      PAYMENT_INTENT_RETENTION: ${PAYMENT_INTENT_RETENTION:-90d}
      PAYMENT_EVENT_RETENTION: ${PAYMENT_EVENT_RETENTION:-400d}
      PAYMENT_RECONCILIATION_INTERVAL: ${PAYMENT_RECONCILIATION_INTERVAL:-5m}
      PAYMENT_CLEANUP_INTERVAL: ${PAYMENT_CLEANUP_INTERVAL:-1h}

      TRIBUTE_ENABLED: ${TRIBUTE_ENABLED:-false}
      TRIBUTE_BASE_URL: ${TRIBUTE_BASE_URL:-https://tribute.tg/api/v1}
      TRIBUTE_API_KEY: ${TRIBUTE_API_KEY:-}
      TRIBUTE_CONNECT_TIMEOUT: ${TRIBUTE_CONNECT_TIMEOUT:-3s}
      TRIBUTE_READ_TIMEOUT: ${TRIBUTE_READ_TIMEOUT:-10s}
      TRIBUTE_WEBHOOK_MAX_BODY_BYTES: ${TRIBUTE_WEBHOOK_MAX_BODY_BYTES:-65536}
      TRIBUTE_WEBHOOK_REQUESTS_PER_MINUTE: ${TRIBUTE_WEBHOOK_REQUESTS_PER_MINUTE:-120}
      SERVER_CONNECTION_TIMEOUT: ${SERVER_CONNECTION_TIMEOUT:-10s}

      USAGE_RESERVATION_TTL: ${USAGE_RESERVATION_TTL:-15m}
      USAGE_CLEANUP_INTERVAL: ${USAGE_CLEANUP_INTERVAL:-1m}
      USAGE_CLEANUP_BATCH_SIZE: ${USAGE_CLEANUP_BATCH_SIZE:-100}

      OPENAPI_DOCS_ENABLED: ${OPENAPI_DOCS_ENABLED:-false}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_BACKEND_ACCESS_KEY: ${MINIO_BACKEND_ACCESS_KEY:-translation-backend}
      MINIO_BACKEND_SECRET_KEY: ${MINIO_BACKEND_SECRET_KEY:-local-backend-secret-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-translation-documents}
      MINIO_ALLOW_INSECURE_HTTP: "true"
      MINIO_ALLOWED_HOSTS: minio
      AVATAR_MAX_UPLOAD_SIZE: ${AVATAR_MAX_UPLOAD_SIZE:-2MB}
      AVATAR_MAX_NORMALIZED_SIZE: ${AVATAR_MAX_NORMALIZED_SIZE:-2MB}
      AVATAR_MAX_DECODED_MEMORY: ${AVATAR_MAX_DECODED_MEMORY:-64MB}
      AVATAR_MAX_WIDTH: ${AVATAR_MAX_WIDTH:-4096}
      AVATAR_MAX_HEIGHT: ${AVATAR_MAX_HEIGHT:-4096}
      AVATAR_MAX_PIXELS: ${AVATAR_MAX_PIXELS:-16777216}
      AVATAR_ORPHAN_RETENTION: ${AVATAR_ORPHAN_RETENTION:-1h}
      AVATAR_CLEANUP_INTERVAL: ${AVATAR_CLEANUP_INTERVAL:-1h}
      AVATAR_CLEANUP_BATCH_SIZE: ${AVATAR_CLEANUP_BATCH_SIZE:-100}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-translation}

      RABBITMQ_TRANSLATION_EXCHANGE: ${RABBITMQ_TRANSLATION_EXCHANGE:-translation.exchange}
      RABBITMQ_TRANSLATION_TASK_QUEUE_V2: ${RABBITMQ_TRANSLATION_TASK_QUEUE_V2:-translation.tasks.v2}
      RABBITMQ_TRANSLATION_ROUTING_KEY: ${RABBITMQ_TRANSLATION_ROUTING_KEY:-translation.task}
      RABBITMQ_TRANSLATION_STATUS_QUEUE_V2: ${RABBITMQ_TRANSLATION_STATUS_QUEUE_V2:-translation.status.v2}
      RABBITMQ_TRANSLATION_STATUS_ROUTING_KEY: ${RABBITMQ_TRANSLATION_STATUS_ROUTING_KEY:-translation.status}
      RABBITMQ_TRANSLATION_DLX: ${RABBITMQ_TRANSLATION_DLX:-translation.dlx}
      RABBITMQ_TRANSLATION_TASK_DLQ: ${RABBITMQ_TRANSLATION_TASK_DLQ:-translation.tasks.v2.dlq}
      RABBITMQ_TRANSLATION_TASK_DLQ_ROUTING_KEY: ${RABBITMQ_TRANSLATION_TASK_DLQ_ROUTING_KEY:-translation.task.dead}
      RABBITMQ_TRANSLATION_STATUS_DLQ: ${RABBITMQ_TRANSLATION_STATUS_DLQ:-translation.status.v2.dlq}
      RABBITMQ_TRANSLATION_STATUS_DLQ_ROUTING_KEY: ${RABBITMQ_TRANSLATION_STATUS_DLQ_ROUTING_KEY:-translation.status.dead}
      RABBITMQ_PUBLISH_CONFIRM_TIMEOUT: ${RABBITMQ_PUBLISH_CONFIRM_TIMEOUT:-5s}
      RABBITMQ_TASK_QUEUE_MAX_LENGTH: ${RABBITMQ_TASK_QUEUE_MAX_LENGTH:-10000}
      RABBITMQ_STATUS_QUEUE_MAX_LENGTH: ${RABBITMQ_STATUS_QUEUE_MAX_LENGTH:-50000}
      RABBITMQ_MAX_MESSAGE_SIZE: ${RABBITMQ_MAX_MESSAGE_SIZE:-64KB}
      RABBITMQ_LISTENER_PREFETCH: ${RABBITMQ_LISTENER_PREFETCH:-10}
      RABBITMQ_LISTENER_CONCURRENCY: ${RABBITMQ_LISTENER_CONCURRENCY:-1}
      RABBITMQ_LISTENER_MAX_CONCURRENCY: ${RABBITMQ_LISTENER_MAX_CONCURRENCY:-4}
      RABBITMQ_STATUS_RETRY_MAX_ATTEMPTS: ${RABBITMQ_STATUS_RETRY_MAX_ATTEMPTS:-3}
      RABBITMQ_STATUS_RETRY_INITIAL_INTERVAL: ${RABBITMQ_STATUS_RETRY_INITIAL_INTERVAL:-500ms}
      RABBITMQ_STATUS_RETRY_MAX_INTERVAL: ${RABBITMQ_STATUS_RETRY_MAX_INTERVAL:-5s}
      RABBITMQ_OUTBOX_PUBLISH_INTERVAL: ${RABBITMQ_OUTBOX_PUBLISH_INTERVAL:-1s}
      RABBITMQ_OUTBOX_BATCH_SIZE: ${RABBITMQ_OUTBOX_BATCH_SIZE:-50}
      RABBITMQ_OUTBOX_MAX_ATTEMPTS: ${RABBITMQ_OUTBOX_MAX_ATTEMPTS:-10}
      RABBITMQ_OUTBOX_INITIAL_BACKOFF: ${RABBITMQ_OUTBOX_INITIAL_BACKOFF:-1s}
      RABBITMQ_OUTBOX_MAX_BACKOFF: ${RABBITMQ_OUTBOX_MAX_BACKOFF:-5m}
      RABBITMQ_OUTBOX_CLAIM_TIMEOUT: ${RABBITMQ_OUTBOX_CLAIM_TIMEOUT:-30s}
      RABBITMQ_OBSERVATION_INTERVAL: ${RABBITMQ_OBSERVATION_INTERVAL:-30s}

      DOCUMENT_MAX_FILE_SIZE: ${DOCUMENT_MAX_FILE_SIZE:-20MB}
      DOCUMENT_MAX_REQUEST_SIZE: ${DOCUMENT_MAX_REQUEST_SIZE:-21MB}
      DOCUMENT_DOCX_MAX_ENTRIES: ${DOCUMENT_DOCX_MAX_ENTRIES:-2000}
      DOCUMENT_DOCX_MAX_ENTRY_SIZE: ${DOCUMENT_DOCX_MAX_ENTRY_SIZE:-50MB}
      DOCUMENT_DOCX_MAX_TOTAL_UNCOMPRESSED_SIZE: ${DOCUMENT_DOCX_MAX_TOTAL_UNCOMPRESSED_SIZE:-100MB}
      DOCUMENT_DOCX_MIN_COMPRESSION_RATIO: ${DOCUMENT_DOCX_MIN_COMPRESSION_RATIO:-0.01}
      DOCUMENT_COMPLETED_SOURCE_RETENTION: ${DOCUMENT_COMPLETED_SOURCE_RETENTION:-1d}
      DOCUMENT_FAILED_SOURCE_RETENTION: ${DOCUMENT_FAILED_SOURCE_RETENTION:-1d}
      DOCUMENT_RESULT_RETENTION: ${DOCUMENT_RESULT_RETENTION:-30d}
      DOCUMENT_ABANDONED_UPLOAD_RETENTION: ${DOCUMENT_ABANDONED_UPLOAD_RETENTION:-1d}
      DOCUMENT_ABANDONED_JOB_TIMEOUT: ${DOCUMENT_ABANDONED_JOB_TIMEOUT:-1d}
      DOCUMENT_CLEANUP_INTERVAL: ${DOCUMENT_CLEANUP_INTERVAL:-10m}
      DOCUMENT_CLEANUP_BATCH_SIZE: ${DOCUMENT_CLEANUP_BATCH_SIZE:-100}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://localhost:8080/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    container_name: translation-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - "postgres_data:/var/lib/postgresql/data"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: translation-rabbitmq
    hostname: translation-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit max_message_size 65536"

    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    build:
      context: ./docker/minio
      target: server
    image: translation-minio:local
    pull_policy: build
    container_name: translation-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY}}

    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    build:
      context: ./docker/minio
      target: client
    image: translation-minio-mc:local
    pull_policy: build
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-${MINIO_ACCESS_KEY}}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-${MINIO_SECRET_KEY}}
      MINIO_BACKEND_ACCESS_KEY: ${MINIO_BACKEND_ACCESS_KEY:-translation-backend}
      MINIO_BACKEND_SECRET_KEY: ${MINIO_BACKEND_SECRET_KEY:-local-backend-secret-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-translation-documents}
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 \
          "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" >/dev/null
        while IFS= read -r policy_line || [ -n "$${policy_line}" ]; do
          policy_line="$${policy_line//__BUCKET__/$${MINIO_BUCKET}}"
          printf '%s\n' "$${policy_line}"
        done < /config/backend-policy.json > /tmp/backend-policy.json
        mc admin policy create local translation-backend \
          /tmp/backend-policy.json >/dev/null
        mc admin user remove local "$${MINIO_BACKEND_ACCESS_KEY}" \
          >/dev/null 2>&1 || true
        mc admin user add local "$${MINIO_BACKEND_ACCESS_KEY}" \
          "$${MINIO_BACKEND_SECRET_KEY}" >/dev/null
        mc admin policy attach local translation-backend \
          --user "$${MINIO_BACKEND_ACCESS_KEY}" >/dev/null
        mc admin user info local "$${MINIO_BACKEND_ACCESS_KEY}" \
          >/dev/null
    volumes:
      - ./docker/minio/backend-policy.json:/config/backend-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
