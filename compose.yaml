services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: translation-backend:local
    container_name: translation-backend
    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-1h}

      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-TRIBUTE}
      PAYMENT_PURCHASE_INTENT_TTL: ${PAYMENT_PURCHASE_INTENT_TTL:-30m}

      TRIBUTE_ENABLED: ${TRIBUTE_ENABLED:-false}
      TRIBUTE_BASE_URL: ${TRIBUTE_BASE_URL:-https://tribute.tg/api/v1}
      TRIBUTE_API_KEY: ${TRIBUTE_API_KEY:-}
      TRIBUTE_CONNECT_TIMEOUT: ${TRIBUTE_CONNECT_TIMEOUT:-3s}
      TRIBUTE_READ_TIMEOUT: ${TRIBUTE_READ_TIMEOUT:-10s}

      USAGE_RESERVATION_TTL: ${USAGE_RESERVATION_TTL:-15m}
      USAGE_CLEANUP_INTERVAL: ${USAGE_CLEANUP_INTERVAL:-1m}
      USAGE_CLEANUP_BATCH_SIZE: ${USAGE_CLEANUP_BATCH_SIZE:-100}

      OPENAPI_DOCS_ENABLED: ${OPENAPI_DOCS_ENABLED:-false}

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-translation-documents}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-translation}

      RABBITMQ_TRANSLATION_EXCHANGE: ${RABBITMQ_TRANSLATION_EXCHANGE:-translation.exchange}
      RABBITMQ_TRANSLATION_QUEUE: ${RABBITMQ_TRANSLATION_QUEUE:-translation.tasks}
      RABBITMQ_TRANSLATION_ROUTING_KEY: ${RABBITMQ_TRANSLATION_ROUTING_KEY:-translation.task}
      RABBITMQ_TRANSLATION_STATUS_QUEUE: ${RABBITMQ_TRANSLATION_STATUS_QUEUE:-translation.status}
      RABBITMQ_TRANSLATION_STATUS_ROUTING_KEY: ${RABBITMQ_TRANSLATION_STATUS_ROUTING_KEY:-translation.status}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--output",
          "/dev/null",
          "http://localhost:8080/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: translation-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - "postgres_data:/var/lib/postgresql/data"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: translation-rabbitmq
    hostname: translation-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: translation-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
