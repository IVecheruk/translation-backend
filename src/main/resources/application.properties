spring.application.name=translation-backend

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:translation_lab}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:translation_app}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:translation}

spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_LISTENER_PREFETCH:10}
spring.rabbitmq.listener.simple.concurrency=${RABBITMQ_LISTENER_CONCURRENCY:1}
spring.rabbitmq.listener.simple.max-concurrency=${RABBITMQ_LISTENER_MAX_CONCURRENCY:4}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${RABBITMQ_STATUS_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=${RABBITMQ_STATUS_RETRY_INITIAL_INTERVAL:500ms}
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=${RABBITMQ_STATUS_RETRY_MAX_INTERVAL:5s}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:1h}

app.payment.purchase-intent-ttl=${PAYMENT_PURCHASE_INTENT_TTL:30m}
app.payment.provider=${PAYMENT_PROVIDER:TRIBUTE}

app.payment.tribute.enabled=${TRIBUTE_ENABLED:false}
app.payment.tribute.base-url=${TRIBUTE_BASE_URL:https://tribute.tg/api/v1}
app.payment.tribute.api-key=${TRIBUTE_API_KEY:}
app.payment.tribute.connect-timeout=${TRIBUTE_CONNECT_TIMEOUT:3s}
app.payment.tribute.read-timeout=${TRIBUTE_READ_TIMEOUT:10s}
app.payment.tribute.webhook-max-body-bytes=${TRIBUTE_WEBHOOK_MAX_BODY_BYTES:65536}
app.payment.tribute.webhook-requests-per-minute=${TRIBUTE_WEBHOOK_REQUESTS_PER_MINUTE:120}
server.tomcat.connection-timeout=${SERVER_CONNECTION_TIMEOUT:10s}
app.payment-maintenance.batch-size=${PAYMENT_MAINTENANCE_BATCH_SIZE:100}
app.payment-maintenance.terminal-intent-retention=${PAYMENT_INTENT_RETENTION:90d}
app.payment-maintenance.processed-event-retention=${PAYMENT_EVENT_RETENTION:400d}
app.payment-maintenance.reconciliation-interval=${PAYMENT_RECONCILIATION_INTERVAL:5m}
app.payment-maintenance.cleanup-interval=${PAYMENT_CLEANUP_INTERVAL:1h}

app.usage.reservation-ttl=${USAGE_RESERVATION_TTL:15m}
app.usage.cleanup-interval=${USAGE_CLEANUP_INTERVAL:1m}
app.usage.cleanup-batch-size=${USAGE_CLEANUP_BATCH_SIZE:100}

app.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.access-key=${MINIO_ACCESS_KEY}
app.storage.secret-key=${MINIO_SECRET_KEY}
app.storage.bucket=${MINIO_BUCKET:translation-documents}

app.messaging.exchange=${RABBITMQ_TRANSLATION_EXCHANGE:translation.exchange}
app.messaging.queue=${RABBITMQ_TRANSLATION_TASK_QUEUE_V2:translation.tasks.v2}
app.messaging.routing-key=${RABBITMQ_TRANSLATION_ROUTING_KEY:translation.task}
app.messaging.status-queue=${RABBITMQ_TRANSLATION_STATUS_QUEUE_V2:translation.status.v2}
app.messaging.status-routing-key=${RABBITMQ_TRANSLATION_STATUS_ROUTING_KEY:translation.status}
app.messaging.dead-letter-exchange=${RABBITMQ_TRANSLATION_DLX:translation.dlx}
app.messaging.task-dead-letter-queue=${RABBITMQ_TRANSLATION_TASK_DLQ:translation.tasks.v2.dlq}
app.messaging.task-dead-letter-routing-key=${RABBITMQ_TRANSLATION_TASK_DLQ_ROUTING_KEY:translation.task.dead}
app.messaging.status-dead-letter-queue=${RABBITMQ_TRANSLATION_STATUS_DLQ:translation.status.v2.dlq}
app.messaging.status-dead-letter-routing-key=${RABBITMQ_TRANSLATION_STATUS_DLQ_ROUTING_KEY:translation.status.dead}
app.messaging.confirm-timeout=${RABBITMQ_PUBLISH_CONFIRM_TIMEOUT:5s}
app.messaging.task-queue-max-length=${RABBITMQ_TASK_QUEUE_MAX_LENGTH:10000}
app.messaging.status-queue-max-length=${RABBITMQ_STATUS_QUEUE_MAX_LENGTH:50000}
app.messaging.max-message-size=${RABBITMQ_MAX_MESSAGE_SIZE:64KB}
app.messaging.listener-prefetch=${RABBITMQ_LISTENER_PREFETCH:10}
app.messaging.listener-concurrency=${RABBITMQ_LISTENER_CONCURRENCY:1}
app.messaging.listener-max-concurrency=${RABBITMQ_LISTENER_MAX_CONCURRENCY:4}
app.messaging.status-retry-max-attempts=${RABBITMQ_STATUS_RETRY_MAX_ATTEMPTS:3}
app.messaging.status-retry-initial-interval=${RABBITMQ_STATUS_RETRY_INITIAL_INTERVAL:500ms}
app.messaging.status-retry-max-interval=${RABBITMQ_STATUS_RETRY_MAX_INTERVAL:5s}
app.messaging.outbox-publish-interval=${RABBITMQ_OUTBOX_PUBLISH_INTERVAL:1s}
app.messaging.outbox-batch-size=${RABBITMQ_OUTBOX_BATCH_SIZE:50}
app.messaging.outbox-max-attempts=${RABBITMQ_OUTBOX_MAX_ATTEMPTS:10}
app.messaging.outbox-initial-backoff=${RABBITMQ_OUTBOX_INITIAL_BACKOFF:1s}
app.messaging.outbox-max-backoff=${RABBITMQ_OUTBOX_MAX_BACKOFF:5m}
app.messaging.outbox-claim-timeout=${RABBITMQ_OUTBOX_CLAIM_TIMEOUT:30s}
app.messaging.observation-interval=${RABBITMQ_OBSERVATION_INTERVAL:30s}

app.document-upload.max-file-size=${DOCUMENT_MAX_FILE_SIZE:20MB}
app.document-validation.docx.max-entries=${DOCUMENT_DOCX_MAX_ENTRIES:2000}
app.document-validation.docx.max-entry-size=${DOCUMENT_DOCX_MAX_ENTRY_SIZE:50MB}
app.document-validation.docx.max-total-uncompressed-size=${DOCUMENT_DOCX_MAX_TOTAL_UNCOMPRESSED_SIZE:100MB}
app.document-validation.docx.min-compression-ratio=${DOCUMENT_DOCX_MIN_COMPRESSION_RATIO:0.01}

app.document-retention.completed-source-retention=${DOCUMENT_COMPLETED_SOURCE_RETENTION:1d}
app.document-retention.failed-source-retention=${DOCUMENT_FAILED_SOURCE_RETENTION:1d}
app.document-retention.result-retention=${DOCUMENT_RESULT_RETENTION:30d}
app.document-retention.abandoned-upload-retention=${DOCUMENT_ABANDONED_UPLOAD_RETENTION:1d}
app.document-retention.abandoned-job-timeout=${DOCUMENT_ABANDONED_JOB_TIMEOUT:1d}
app.document-retention.cleanup-interval=${DOCUMENT_CLEANUP_INTERVAL:10m}
app.document-retention.cleanup-batch-size=${DOCUMENT_CLEANUP_BATCH_SIZE:100}

spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_REQUEST_SIZE:21MB}

springdoc.api-docs.enabled=${OPENAPI_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_DOCS_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
