spring.application.name=translation-backend

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:translation_lab}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:translation_app}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:translation}

spring.rabbitmq.connection-timeout=5s

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:1h}

app.payment.purchase-intent-ttl=${PAYMENT_PURCHASE_INTENT_TTL:30m}
app.payment.provider=${PAYMENT_PROVIDER:TRIBUTE}

app.payment.tribute.enabled=${TRIBUTE_ENABLED:false}
app.payment.tribute.base-url=${TRIBUTE_BASE_URL:https://tribute.tg/api/v1}
app.payment.tribute.api-key=${TRIBUTE_API_KEY:}
app.payment.tribute.connect-timeout=${TRIBUTE_CONNECT_TIMEOUT:3s}
app.payment.tribute.read-timeout=${TRIBUTE_READ_TIMEOUT:10s}

app.usage.reservation-ttl=${USAGE_RESERVATION_TTL:15m}
app.usage.cleanup-interval=${USAGE_CLEANUP_INTERVAL:1m}
app.usage.cleanup-batch-size=${USAGE_CLEANUP_BATCH_SIZE:100}

app.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.storage.access-key=${MINIO_ACCESS_KEY}
app.storage.secret-key=${MINIO_SECRET_KEY}
app.storage.bucket=${MINIO_BUCKET:translation-documents}

app.messaging.exchange=${RABBITMQ_TRANSLATION_EXCHANGE:translation.exchange}
app.messaging.queue=${RABBITMQ_TRANSLATION_QUEUE:translation.tasks}
app.messaging.routing-key=${RABBITMQ_TRANSLATION_ROUTING_KEY:translation.task}
app.messaging.status-queue=${RABBITMQ_TRANSLATION_STATUS_QUEUE:translation.status}
app.messaging.status-routing-key=${RABBITMQ_TRANSLATION_STATUS_ROUTING_KEY:translation.status}

app.document-upload.max-file-size=${DOCUMENT_MAX_FILE_SIZE:20MB}
app.document-validation.docx.max-entries=${DOCUMENT_DOCX_MAX_ENTRIES:2000}
app.document-validation.docx.max-entry-size=${DOCUMENT_DOCX_MAX_ENTRY_SIZE:50MB}
app.document-validation.docx.max-total-uncompressed-size=${DOCUMENT_DOCX_MAX_TOTAL_UNCOMPRESSED_SIZE:100MB}
app.document-validation.docx.min-compression-ratio=${DOCUMENT_DOCX_MIN_COMPRESSION_RATIO:0.01}

app.document-retention.completed-source-retention=${DOCUMENT_COMPLETED_SOURCE_RETENTION:1d}
app.document-retention.failed-source-retention=${DOCUMENT_FAILED_SOURCE_RETENTION:1d}
app.document-retention.result-retention=${DOCUMENT_RESULT_RETENTION:30d}
app.document-retention.abandoned-upload-retention=${DOCUMENT_ABANDONED_UPLOAD_RETENTION:1d}
app.document-retention.abandoned-job-timeout=${DOCUMENT_ABANDONED_JOB_TIMEOUT:1d}
app.document-retention.cleanup-interval=${DOCUMENT_CLEANUP_INTERVAL:10m}
app.document-retention.cleanup-batch-size=${DOCUMENT_CLEANUP_BATCH_SIZE:100}

spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${DOCUMENT_MAX_REQUEST_SIZE:21MB}

springdoc.api-docs.enabled=${OPENAPI_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${OPENAPI_DOCS_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
